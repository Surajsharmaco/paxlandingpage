openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Punar Axis Therapy public and protected attendance API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: attendance
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Error"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /attendance/settings/public:
    get:
      operationId: getPublicAttendanceSettings
      tags: [attendance]
      responses:
        "200":
          description: Public capture constraints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAttendanceSettings"
  /attendance/session:
    post:
      operationId: createAttendanceSession
      tags: [attendance]
      responses:
        "200":
          description: One-time attendance challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSession"
  /attendance/finalize:
    post:
      operationId: finalizeAttendance
      tags: [attendance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeAttendanceRequest"
      responses:
        "201":
          description: Attendance recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceResponse"
  /attendance/checkout/session:
    post:
      operationId: createCheckoutSession
      tags: [attendance]
      responses:
        "200":
          description: One-time check-out challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSession"
  /attendance/checkout:
    post:
      operationId: checkoutAttendance
      tags: [attendance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeAttendanceRequest"
      responses:
        "200":
          description: Check-out recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceResponse"
  /attendance/me:
    get:
      operationId: getMyAttendance
      tags: [attendance]
      responses:
        "200":
          description: Current attendance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyAttendanceResponse"
  /attendance/me/history:
    get:
      operationId: getMyAttendanceHistory
      tags: [attendance]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Attendance history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceHistoryResponse"
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      responses:
        "200":
          description: Admin dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
  /admin/employees:
    get:
      operationId: listEmployees
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Team directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeListResponse"
    post:
      operationId: createEmployee
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeRequest"
      responses:
        "201":
          description: Employee created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
  /admin/employees/{id}:
    patch:
      operationId: updateEmployee
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeRequest"
      responses:
        "200":
          description: Employee updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
  /admin/employees/{id}/attendance:
    get:
      operationId: getEmployeeMonthlyAttendance
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: month
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
      responses:
        "200":
          description: Employee monthly attendance calendar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeMonthlyAttendanceResponse"
  /admin/employees/{id}/reset-password:
    post:
      operationId: resetEmployeePassword
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRequest"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /admin/attendance:
    get:
      operationId: listAttendance
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: employeeId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Attendance records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAttendanceResponse"
  /admin/attendance/{id}:
    get:
      operationId: getAttendanceDetail
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Attendance detail and audit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceDetailResponse"
  /admin/attendance/{id}/correction:
    post:
      operationId: correctAttendance
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorrectionRequest"
      responses:
        "200":
          description: Corrected attendance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceResponse"
  /admin/reports/export.csv:
    get:
      operationId: exportAttendance
      tags: [admin]
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Least-privilege CSV export
          content:
            text/csv:
              schema: { type: string }
  /admin/settings:
    get:
      operationId: getAttendanceSettings
      tags: [admin]
      responses:
        "200":
          description: Attendance configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
    put:
      operationId: updateAttendanceSettings
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
  /admin/audit:
    get:
      operationId: listAuditLog
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Immutable audit log
          content:
            application/json:
              schema:
                type: object
                properties:
                  audit:
                    type: array
                    items: { type: object, additionalProperties: true }
                  page: { type: integer }
                  pageSize: { type: integer }
                required: [audit, page, pageSize]
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties: { status: { type: string } }
      required: [status]
    ErrorResponse:
      type: object
      properties: { message: { type: string } }
      required: [message]
    SuccessResponse:
      type: object
      properties: { success: { type: boolean } }
      required: [success]
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string }
        email: { type: string, nullable: true }
        name: { type: string }
        role: { type: string, enum: [SUPER_ADMIN, TEAM_MEMBER] }
        active: { type: boolean }
      required: [id, employeeId, name, role, active]
    AuthResponse:
      type: object
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
      required: [user]
    LoginRequest:
      type: object
      properties:
        identifier: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
        portal: { type: string, enum: [admin, team] }
      required: [identifier, password, portal]
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 12 }
      required: [currentPassword, newPassword]
    PasswordRequest:
      type: object
      properties: { password: { type: string, minLength: 12 } }
      required: [password]
    AttendanceRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        employeeId: { type: string }
        employeeName: { type: string }
        workDate: { type: string, format: date }
        checkInAt: { type: string, format: date-time }
        checkOutAt: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [PRESENT, LATE, FLAGGED, REJECTED, CORRECTED] }
        riskLevel: { type: string, enum: [LOW, MEDIUM, HIGH] }
        riskSignals: { type: array, items: { type: string } }
        correctionReason: { type: string, nullable: true }
      required: [id, userId, workDate, checkInAt, status, riskLevel, riskSignals]
    AttendanceResponse:
      type: object
      properties: { record: { $ref: "#/components/schemas/AttendanceRecord" } }
      required: [record]
    MyAttendanceResponse:
      type: object
      properties:
        today:
          oneOf:
            - $ref: "#/components/schemas/AttendanceRecord"
            - type: "null"
        serverTime: { type: string, format: date-time }
      required: [today, serverTime]
    AttendanceHistoryResponse:
      type: object
      properties:
        records: { type: array, items: { $ref: "#/components/schemas/AttendanceRecord" } }
        page: { type: integer }
        pageSize: { type: integer }
      required: [records, page, pageSize]
    AttendanceSession:
      type: object
      properties:
        nonce: { type: string }
        expiresAt: { type: string, format: date-time }
        serverTime: { type: string, format: date-time }
        privacyNoticeVersion: { type: string }
      required: [nonce, expiresAt, serverTime, privacyNoticeVersion]
    FinalizeAttendanceRequest:
      type: object
      properties:
        nonce: { type: string }
        idempotencyKey: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        accuracyM: { type: number }
        consent: { type: boolean }
        consentVersion: { type: string }
        captureMethod: { type: string, enum: [camera] }
        facePhoto: { type: string }
        workplacePhoto: { type: string }
        integritySignals: { type: string }
      required: [nonce, idempotencyKey, latitude, longitude, accuracyM, consent, consentVersion, captureMethod, facePhoto, workplacePhoto]
    PublicAttendanceSettings:
      type: object
      properties:
        privacyNoticeVersion: { type: string }
        maxGpsAccuracyM: { type: integer }
        geofenceRadiusM: { type: integer }
      required: [privacyNoticeVersion, maxGpsAccuracyM, geofenceRadiusM]
    AdminSummary:
      type: object
      properties:
        date: { type: string, format: date }
        activeEmployees: { type: integer }
        presentToday: { type: integer }
        attendancePercent: { type: integer, minimum: 0, maximum: 100 }
        flaggedToday: { type: integer }
      required: [date, activeEmployees, presentToday, attendancePercent, flaggedToday]
    Employee:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            lastLoginAt: { type: string, format: date-time, nullable: true }
            createdAt: { type: string, format: date-time }
            minimumWorkMinutes: { type: integer, minimum: 0, maximum: 1440 }
    CreateEmployeeRequest:
      type: object
      properties:
        employeeId: { type: string }
        email: { type: string, nullable: true }
        name: { type: string }
        password: { type: string, minLength: 12 }
        minimumWorkMinutes: { type: integer, minimum: 0, maximum: 1440 }
      required: [employeeId, name, password]
    UpdateEmployeeRequest:
      type: object
      properties:
        name: { type: string }
        email: { type: string, nullable: true }
        active: { type: boolean }
        minimumWorkMinutes: { type: integer, minimum: 0, maximum: 1440 }
    EmployeeResponse:
      type: object
      properties: { employee: { $ref: "#/components/schemas/Employee" } }
      required: [employee]
    EmployeeListResponse:
      type: object
      properties:
        employees: { type: array, items: { $ref: "#/components/schemas/Employee" } }
        page: { type: integer }
        pageSize: { type: integer }
      required: [employees, page, pageSize]
    AdminAttendanceResponse:
      type: object
      properties:
        records: { type: array, items: { $ref: "#/components/schemas/AttendanceRecord" } }
        page: { type: integer }
        pageSize: { type: integer }
        from: { type: string, format: date }
        to: { type: string, format: date }
      required: [records, page, pageSize, from, to]
    AttendanceDetailResponse:
      type: object
      properties:
        record: { $ref: "#/components/schemas/AttendanceRecord" }
        evidence: { type: object, nullable: true, additionalProperties: true }
        checkoutEvidence: { type: object, nullable: true, additionalProperties: true }
        audit: { type: array, items: { type: object, additionalProperties: true } }
      required: [record, evidence, checkoutEvidence, audit]
    EmployeeMonthlyAttendanceResponse:
      type: object
      properties:
        month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        employee: { $ref: "#/components/schemas/Employee" }
        targetMinutes: { type: integer }
        targetHours: { type: number }
        summary:
          type: object
          properties:
            daysMet: { type: integer }
            daysBelowTarget: { type: integer }
            daysMissed: { type: integer }
            eligibleDays: { type: integer }
            totalWorkedMinutes: { type: integer }
            completionPercentage: { type: integer, minimum: 0, maximum: 100 }
          required: [daysMet, daysBelowTarget, daysMissed, eligibleDays, totalWorkedMinutes, completionPercentage]
        days:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              state: { type: string, enum: [MET, BELOW_TARGET, MISSED, IN_PROGRESS, TODAY, FUTURE, RECORDED] }
              checkInAt: { type: string, format: date-time, nullable: true }
              checkOutAt: { type: string, format: date-time, nullable: true }
              workedMinutes: { type: integer }
              status: { type: string, nullable: true }
              riskLevel: { type: string, nullable: true }
              recordId: { type: string, format: uuid, nullable: true }
              hasCheckInEvidence: { type: boolean }
              hasCheckoutEvidence: { type: boolean }
              checkInLocation: { $ref: "#/components/schemas/AttendanceLocation", nullable: true }
              checkoutLocation: { $ref: "#/components/schemas/AttendanceLocation", nullable: true }
            required: [date, state, checkInAt, checkOutAt, workedMinutes, status, riskLevel, recordId, hasCheckInEvidence, hasCheckoutEvidence, checkInLocation, checkoutLocation]
      required: [month, employee, targetMinutes, targetHours, summary, days]
    AttendanceLocation:
      type: object
      properties:
        latitude: { type: number }
        longitude: { type: number }
        accuracyM: { type: number }
        capturedAt: { type: string, format: date-time }
      required: [latitude, longitude, accuracyM, capturedAt]
    CorrectionRequest:
      type: object
      properties:
        checkInAt: { type: string, format: date-time }
        checkOutAt: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [PRESENT, LATE, FLAGGED, REJECTED, CORRECTED] }
        reason: { type: string, minLength: 5 }
      required: [reason]
    Settings:
      type: object
      properties:
        clinicLatitude: { type: number }
        clinicLongitude: { type: number }
        geofenceRadiusM: { type: integer }
        maxGpsAccuracyM: { type: integer }
        lateAfterMinutes: { type: integer }
        retentionDays: { type: integer }
        privacyNoticeVersion: { type: string }
      required: [clinicLatitude, clinicLongitude, geofenceRadiusM, maxGpsAccuracyM, lateAfterMinutes, retentionDays, privacyNoticeVersion]
    SettingsResponse:
      type: object
      properties: { settings: { $ref: "#/components/schemas/Settings" } }
      required: [settings]